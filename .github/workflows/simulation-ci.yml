name: simulation-ci

# Physics regression on every push. The failure these catch is silent: a model
# that loads, simulates, and has wrong dynamics.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # weekly, to catch upstream dependency drift

jobs:
  physics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the current release AND track the latest, so an upstream change
        # in MuJoCo shows up here rather than in someone's training run.
        mujoco: ["3.12.0", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install -q --upgrade pip
          if [ "${{ matrix.mujoco }}" = "latest" ]; then
            pip install -q mujoco numpy pytest
          else
            pip install -q "mujoco==${{ matrix.mujoco }}" numpy pytest
          fi

      - name: regenerate model from spec
        # Never test a committed artifact -- regenerate, so a stale file
        # cannot make CI pass.
        run: python model/emit.py

      - name: fail if generated files differ from committed ones
        run: |
          if ! git diff --exit-code -- model/arm3.xml model/arm3.urdf model/arm3.sdf; then
            echo "::error::Generated model differs from the committed files."
            echo "Someone edited a format by hand instead of editing robot_spec.py."
            exit 1
          fi

      - name: model integrity + physics regression
        run: python -m pytest tests/ -v --tb=short

      - name: validation report
        if: always()
        run: |
          python model/validate.py
          cat model/validation.json
