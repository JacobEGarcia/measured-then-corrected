name: simulation-ci

# Physics regression on every push. The failure these catch is silent: a model
# that loads, simulates, and has wrong dynamics.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # weekly, to catch upstream dependency drift

jobs:
  physics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the current release AND track the latest, so an upstream change
        # in MuJoCo shows up here rather than in someone's training run.
        mujoco: ["3.12.0", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install -q --upgrade pip
          if [ "${{ matrix.mujoco }}" = "latest" ]; then
            pip install -q mujoco numpy pytest
          else
            pip install -q "mujoco==${{ matrix.mujoco }}" numpy pytest
          fi

      - name: regenerate model from spec
        # Never test a committed artifact -- regenerate, so a stale file
        # cannot make CI pass.
        run: python model/emit.py

      - name: fail if generated files differ from committed ones
        run: |
          if ! git diff --exit-code -- model/arm3.xml model/arm3.urdf model/arm3.sdf; then
            echo "::error::Generated model differs from the committed files."
            echo "Someone edited a format by hand instead of editing robot_spec.py."
            exit 1
          fi

      - name: model integrity + physics regression
        run: python -m pytest tests/ -v --tb=short

      - name: validation report
        if: always()
        run: |
          python model/validate.py
          cat model/validation.json

      - name: regenerate every measured JSON the README quotes
        # ALL of them, including the slow ones. Regenerating only the fast
        # studies would let the checker pass against stale committed JSON,
        # which is precisely the drift it exists to catch.
        # determinism.py ~90 s, integrators.py ~20 s; the rest are seconds.
        run: |
          python model/closed_chain.py > /dev/null
          python model/collision_cost.py > /dev/null
          python model/friction_cone.py > /dev/null
          python model/integrators.py > /dev/null
          python model/determinism.py > /dev/null
          python model/crossengine_contact.py > /dev/null
          python model/gait_validation.py > /dev/null

      - name: README claims must match the measured JSON
        run: python tools/check_readme_claims.py

      - name: measured JSON must not have drifted (deterministic fields only)
        # If a study now produces different PHYSICS, that is a finding, not a
        # nuisance -- it must be reviewed and committed deliberately.
        # Clock-derived fields are excluded: absolute throughput moved 42-76%
        # between runs on one idle machine, so diffing it would produce a gate
        # that always fails and therefore always gets ignored.
        run: PY=python bash tools/check_json_drift.sh
